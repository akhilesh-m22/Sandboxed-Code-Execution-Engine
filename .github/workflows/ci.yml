name: Quality checks
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check frontend/js/app.js
  docker:
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ci-only-generated-test-token-not-for-deployment-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: docker build -f sandbox/Dockerfile -t codeforge-sandbox:local .
      - run: docker build --target api -t codeforge-api:ci .
      - run: docker build --target worker -t codeforge-worker:ci .
      - run: python -m pytest -q tests/test_docker_integration.py
        env:
          RUN_DOCKER_TESTS: '1'
      - name: Compose HTTP smoke test
        run: |
          export DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
          docker compose up --build --wait --wait-timeout 90
          python scripts/smoke.py
      - name: Compose diagnostics and cleanup
        if: always()
        run: |
          docker compose logs --tail 50
          docker compose down --volumes
